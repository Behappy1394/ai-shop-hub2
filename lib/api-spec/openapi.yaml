openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: AI SHOP HUB API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: auth
  - name: products
  - name: orders
  - name: payments
  - name: reviews
  - name: promo
  - name: user
  - name: admin
  - name: currencies
  - name: settings

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # Auth
  /auth/register:
    post:
      operationId: register
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterInput"
      responses:
        "201":
          description: Registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  # Products
  /products:
    get:
      operationId: listProducts
      tags: [products]
      parameters:
        - name: featured
          in: query
          schema:
            type: ["boolean", "null"]
        - name: search
          in: query
          schema:
            type: ["string", "null"]
      responses:
        "200":
          description: Products list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Product"

  /products/featured:
    get:
      operationId: getFeaturedProducts
      tags: [products]
      responses:
        "200":
          description: Featured products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Product"

  /products/{id}:
    get:
      operationId: getProduct
      tags: [products]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Product detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"

  # Reviews
  /products/{id}/reviews:
    get:
      operationId: listProductReviews
      tags: [reviews]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Reviews
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Review"
    post:
      operationId: createReview
      tags: [reviews]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewInput"
      responses:
        "201":
          description: Review created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Review"

  # Orders
  /orders:
    get:
      operationId: listOrders
      tags: [orders]
      responses:
        "200":
          description: User orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Order"
    post:
      operationId: createOrder
      tags: [orders]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderInput"
      responses:
        "201":
          description: Order created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderWithPayment"

  /orders/{id}:
    get:
      operationId: getOrder
      tags: [orders]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Order detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"

  # Promo codes
  /promo/validate:
    post:
      operationId: validatePromo
      tags: [promo]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PromoInput"
      responses:
        "200":
          description: Promo validation result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PromoResult"

  # Payments
  /payments/freekassa/success:
    get:
      operationId: paymentSuccess
      tags: [payments]
      parameters:
        - name: MERCHANT_ORDER_ID
          in: query
          schema:
            type: ["string", "null"]
        - name: AMOUNT
          in: query
          schema:
            type: ["string", "null"]
      responses:
        "200":
          description: Payment confirmed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentStatus"

  /payments/freekassa/fail:
    get:
      operationId: paymentFail
      tags: [payments]
      responses:
        "200":
          description: Payment failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentStatus"

  /payments/freekassa/webhook:
    post:
      operationId: paymentWebhook
      tags: [payments]
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/WebhookPayload"
      responses:
        "200":
          description: Webhook processed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentStatus"

  # User dashboard
  /user/dashboard:
    get:
      operationId: getUserDashboard
      tags: [user]
      responses:
        "200":
          description: User dashboard stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserDashboard"

  /user/profile:
    patch:
      operationId: updateProfile
      tags: [user]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileUpdate"
      responses:
        "200":
          description: Profile updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  # Currencies
  /currencies:
    get:
      operationId: listCurrencies
      tags: [currencies]
      responses:
        "200":
          description: Available currencies
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Currency"

  # Settings (public)
  /settings/public:
    get:
      operationId: getPublicSettings
      tags: [settings]
      responses:
        "200":
          description: Public site settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicSettings"

  # Admin routes
  /admin/stats:
    get:
      operationId: getAdminStats
      tags: [admin]
      responses:
        "200":
          description: Admin dashboard stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminStats"

  /admin/users:
    get:
      operationId: listAdminUsers
      tags: [admin]
      parameters:
        - name: page
          in: query
          schema:
            type: ["integer", "null"]
        - name: limit
          in: query
          schema:
            type: ["integer", "null"]
      responses:
        "200":
          description: Users list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedUsers"

  /admin/users/{id}:
    patch:
      operationId: updateAdminUser
      tags: [admin]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminUserUpdate"
      responses:
        "200":
          description: User updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
    delete:
      operationId: deleteAdminUser
      tags: [admin]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: User deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessMessage"

  /admin/orders:
    get:
      operationId: listAdminOrders
      tags: [admin]
      parameters:
        - name: page
          in: query
          schema:
            type: ["integer", "null"]
        - name: status
          in: query
          schema:
            type: ["string", "null"]
      responses:
        "200":
          description: All orders
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedOrders"

  /admin/orders/{id}:
    patch:
      operationId: updateAdminOrder
      tags: [admin]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminOrderUpdate"
      responses:
        "200":
          description: Order updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"

  /admin/products:
    get:
      operationId: listAdminProducts
      tags: [admin]
      responses:
        "200":
          description: All products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Product"
    post:
      operationId: createProduct
      tags: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductInput"
      responses:
        "201":
          description: Product created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"

  /admin/products/{id}:
    patch:
      operationId: updateProduct
      tags: [admin]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductUpdate"
      responses:
        "200":
          description: Product updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
    delete:
      operationId: deleteProduct
      tags: [admin]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Product deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessMessage"

  /admin/currencies:
    get:
      operationId: listAdminCurrencies
      tags: [admin]
      responses:
        "200":
          description: All currencies
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Currency"
    post:
      operationId: createCurrency
      tags: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CurrencyInput"
      responses:
        "201":
          description: Currency created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Currency"

  /admin/currencies/{id}:
    patch:
      operationId: updateCurrency
      tags: [admin]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CurrencyUpdate"
      responses:
        "200":
          description: Currency updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Currency"

  /admin/promo:
    get:
      operationId: listAdminPromo
      tags: [admin]
      responses:
        "200":
          description: All promo codes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PromoCode"
    post:
      operationId: createPromo
      tags: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PromoCodeInput"
      responses:
        "201":
          description: Promo code created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PromoCode"

  /admin/promo/{id}:
    delete:
      operationId: deletePromo
      tags: [admin]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Promo deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessMessage"

  /admin/settings:
    get:
      operationId: getAdminSettings
      tags: [admin]
      responses:
        "200":
          description: All settings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Setting"
    patch:
      operationId: updateSettings
      tags: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SettingsUpdate"
      responses:
        "200":
          description: Settings updated
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Setting"

  /admin/analytics/revenue:
    get:
      operationId: getRevenueAnalytics
      tags: [admin]
      parameters:
        - name: days
          in: query
          schema:
            type: ["integer", "null"]
      responses:
        "200":
          description: Revenue analytics
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RevenuePoint"

  /admin/analytics/products:
    get:
      operationId: getProductAnalytics
      tags: [admin]
      responses:
        "200":
          description: Product sales analytics
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProductSales"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    # Auth
    RegisterInput:
      type: object
      required: [email, password, name]
      properties:
        email: { type: string }
        password: { type: string }
        name: { type: string }

    LoginInput:
      type: object
      required: [email, password]
      properties:
        email: { type: string }
        password: { type: string }

    AuthResponse:
      type: object
      required: [token, user]
      properties:
        token: { type: string }
        user:
          $ref: "#/components/schemas/User"

    User:
      type: object
      required: [id, email, name, role, createdAt]
      properties:
        id: { type: integer }
        email: { type: string }
        name: { type: string }
        role: { type: string }
        isBlocked: { type: boolean }
        createdAt: { type: string }

    ProfileUpdate:
      type: object
      properties:
        name: { type: string }
        email: { type: string }
        password: { type: ["string", "null"] }

    AdminUserUpdate:
      type: object
      properties:
        role: { type: ["string", "null"] }
        isBlocked: { type: ["boolean", "null"] }

    # Products
    Product:
      type: object
      required: [id, name, description, price, currency, duration, category, stock, isActive]
      properties:
        id: { type: integer }
        name: { type: string }
        description: { type: string }
        price: { type: number }
        originalPrice: { type: ["number", "null"] }
        currency: { type: string }
        duration: { type: string }
        category: { type: string }
        imageUrl: { type: ["string", "null"] }
        badge: { type: ["string", "null"] }
        rating: { type: ["number", "null"] }
        reviewCount: { type: ["integer", "null"] }
        stock: { type: integer }
        isActive: { type: boolean }
        isFeatured: { type: boolean }
        createdAt: { type: string }

    ProductInput:
      type: object
      required: [name, description, price, currency, duration, category]
      properties:
        name: { type: string }
        description: { type: string }
        price: { type: number }
        originalPrice: { type: ["number", "null"] }
        currency: { type: string }
        duration: { type: string }
        category: { type: string }
        imageUrl: { type: ["string", "null"] }
        badge: { type: ["string", "null"] }
        stock: { type: integer }
        isActive: { type: boolean }
        isFeatured: { type: boolean }

    ProductUpdate:
      type: object
      properties:
        name: { type: ["string", "null"] }
        description: { type: ["string", "null"] }
        price: { type: ["number", "null"] }
        originalPrice: { type: ["number", "null"] }
        currency: { type: ["string", "null"] }
        duration: { type: ["string", "null"] }
        category: { type: ["string", "null"] }
        imageUrl: { type: ["string", "null"] }
        badge: { type: ["string", "null"] }
        stock: { type: ["integer", "null"] }
        isActive: { type: ["boolean", "null"] }
        isFeatured: { type: ["boolean", "null"] }

    # Orders
    OrderInput:
      type: object
      required: [productId, currency]
      properties:
        productId: { type: integer }
        currency: { type: string }
        promoCode: { type: ["string", "null"] }

    Order:
      type: object
      required: [id, userId, productId, status, amount, currency, createdAt]
      properties:
        id: { type: integer }
        userId: { type: integer }
        productId: { type: integer }
        status: { type: string }
        amount: { type: number }
        currency: { type: string }
        promoCode: { type: ["string", "null"] }
        discountAmount: { type: ["number", "null"] }
        paymentUrl: { type: ["string", "null"] }
        product:
          $ref: "#/components/schemas/Product"
        createdAt: { type: string }
        activatedAt: { type: ["string", "null"] }

    OrderWithPayment:
      type: object
      required: [order, paymentUrl]
      properties:
        order:
          $ref: "#/components/schemas/Order"
        paymentUrl: { type: string }

    AdminOrderUpdate:
      type: object
      properties:
        status: { type: ["string", "null"] }

    # Reviews
    Review:
      type: object
      required: [id, userId, productId, rating, createdAt]
      properties:
        id: { type: integer }
        userId: { type: integer }
        productId: { type: integer }
        rating: { type: integer }
        comment: { type: ["string", "null"] }
        userName: { type: ["string", "null"] }
        createdAt: { type: string }

    ReviewInput:
      type: object
      required: [rating]
      properties:
        rating: { type: integer }
        comment: { type: ["string", "null"] }

    # Promo
    PromoInput:
      type: object
      required: [code, productId]
      properties:
        code: { type: string }
        productId: { type: integer }

    PromoResult:
      type: object
      required: [valid, discount]
      properties:
        valid: { type: boolean }
        discount: { type: number }
        type: { type: ["string", "null"] }
        message: { type: ["string", "null"] }

    PromoCode:
      type: object
      required: [id, code, discount, type, usageLimit, usageCount, isActive]
      properties:
        id: { type: integer }
        code: { type: string }
        discount: { type: number }
        type: { type: string }
        usageLimit: { type: integer }
        usageCount: { type: integer }
        isActive: { type: boolean }
        expiresAt: { type: ["string", "null"] }
        createdAt: { type: string }

    PromoCodeInput:
      type: object
      required: [code, discount, type, usageLimit]
      properties:
        code: { type: string }
        discount: { type: number }
        type: { type: string }
        usageLimit: { type: integer }
        expiresAt: { type: ["string", "null"] }

    # Payments
    PaymentStatus:
      type: object
      required: [success, message]
      properties:
        success: { type: boolean }
        message: { type: string }
        orderId: { type: ["integer", "null"] }

    WebhookPayload:
      type: object
      properties:
        MERCHANT_ID: { type: ["string", "null"] }
        AMOUNT: { type: ["string", "null"] }
        intid: { type: ["string", "null"] }
        MERCHANT_ORDER_ID: { type: ["string", "null"] }
        P_EMAIL: { type: ["string", "null"] }
        P_PHONE: { type: ["string", "null"] }
        CUR_ID: { type: ["string", "null"] }
        SIGN: { type: ["string", "null"] }
        payer_account: { type: ["string", "null"] }
        commission: { type: ["string", "null"] }

    # Dashboard
    UserDashboard:
      type: object
      required: [totalOrders, activeOrders, totalSpent, recentOrders]
      properties:
        totalOrders: { type: integer }
        activeOrders: { type: integer }
        totalSpent: { type: number }
        recentOrders:
          type: array
          items:
            $ref: "#/components/schemas/Order"

    AdminStats:
      type: object
      required: [totalUsers, totalOrders, totalRevenue, activeOrders, pendingOrders, todayRevenue, todayOrders]
      properties:
        totalUsers: { type: integer }
        totalOrders: { type: integer }
        totalRevenue: { type: number }
        activeOrders: { type: integer }
        pendingOrders: { type: integer }
        todayRevenue: { type: number }
        todayOrders: { type: integer }

    # Pagination
    PaginatedUsers:
      type: object
      required: [data, total, page, limit]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/User"
        total: { type: integer }
        page: { type: integer }
        limit: { type: integer }

    PaginatedOrders:
      type: object
      required: [data, total, page, limit]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Order"
        total: { type: integer }
        page: { type: integer }
        limit: { type: integer }

    # Currencies
    Currency:
      type: object
      required: [id, code, name, symbol, rate, isDefault, isActive]
      properties:
        id: { type: integer }
        code: { type: string }
        name: { type: string }
        symbol: { type: string }
        rate: { type: number }
        isDefault: { type: boolean }
        isActive: { type: boolean }

    CurrencyInput:
      type: object
      required: [code, name, symbol, rate]
      properties:
        code: { type: string }
        name: { type: string }
        symbol: { type: string }
        rate: { type: number }
        isDefault: { type: boolean }
        isActive: { type: boolean }

    CurrencyUpdate:
      type: object
      properties:
        name: { type: ["string", "null"] }
        symbol: { type: ["string", "null"] }
        rate: { type: ["number", "null"] }
        isDefault: { type: ["boolean", "null"] }
        isActive: { type: ["boolean", "null"] }

    # Settings
    Setting:
      type: object
      required: [key, value]
      properties:
        key: { type: string }
        value: { type: string }
        label: { type: ["string", "null"] }

    SettingsUpdate:
      type: object
      properties:
        settings:
          type: array
          items:
            type: object
            required: [key, value]
            properties:
              key: { type: string }
              value: { type: string }

    PublicSettings:
      type: object
      properties:
        siteName: { type: ["string", "null"] }
        siteDescription: { type: ["string", "null"] }
        telegramSupport: { type: ["string", "null"] }
        bannerText: { type: ["string", "null"] }
        bannerEnabled: { type: ["boolean", "null"] }

    # Analytics
    RevenuePoint:
      type: object
      required: [date, revenue, orders]
      properties:
        date: { type: string }
        revenue: { type: number }
        orders: { type: integer }

    ProductSales:
      type: object
      required: [productId, name, count, revenue]
      properties:
        productId: { type: integer }
        name: { type: string }
        count: { type: integer }
        revenue: { type: number }

    SuccessMessage:
      type: object
      required: [success, message]
      properties:
        success: { type: boolean }
        message: { type: string }
